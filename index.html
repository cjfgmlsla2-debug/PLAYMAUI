<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>믹스테이프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #eef0ef;
    --surface: #ffffff;
    --surface-2: #e5e8e7;
    --surface-3: #d7dbda;
    --text: #1a1d1c;
    --text-muted: #5b6260;
    --text-faint: #8a908e;
    --accent: #c96a1f;
    --accent-ink: #fffaf3;
    --border: #cfd4d2;
    --lcd-bg: #1b2320;
    --lcd-fg: #f0a85c;
    --lcd-fg-dim: #5c7a68;
    --shadow: rgba(24, 28, 26, 0.14);
    --danger: #b8452f;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181a;
      --surface: #1d2224;
      --surface-2: #262b2d;
      --surface-3: #313739;
      --text: #edf1ef;
      --text-muted: #949b98;
      --text-faint: #656d6a;
      --accent: #f0a15a;
      --accent-ink: #1a1508;
      --border: #363d3f;
      --lcd-bg: #0e1412;
      --lcd-fg: #f0a85c;
      --lcd-fg-dim: #445a4e;
      --shadow: rgba(0, 0, 0, 0.45);
      --danger: #e0725a;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14181a;
    --surface: #1d2224;
    --surface-2: #262b2d;
    --surface-3: #313739;
    --text: #edf1ef;
    --text-muted: #949b98;
    --text-faint: #656d6a;
    --accent: #f0a15a;
    --accent-ink: #1a1508;
    --border: #363d3f;
    --lcd-bg: #0e1412;
    --lcd-fg: #f0a85c;
    --lcd-fg-dim: #445a4e;
    --shadow: rgba(0, 0, 0, 0.45);
    --danger: #e0725a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Sora", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .mono {
    font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  .deck {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 24px 48px -20px var(--shadow), 0 2px 0 var(--border) inset;
    position: relative;
  }

  .deck.drag-over::after {
    content: "여기에 놓으면 담겨요";
    position: absolute;
    inset: 8px;
    border: 2px dashed var(--accent);
    border-radius: 16px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    color: var(--accent);
    z-index: 5;
    pointer-events: none;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .brand svg { flex-shrink: 0; }

  .brand-text {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .brand-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-faint);
  }

  /* LCD display */
  .lcd {
    background: var(--lcd-bg);
    border-radius: 14px;
    padding: 16px 18px;
    color: var(--lcd-fg);
    position: relative;
    overflow: hidden;
  }

  .lcd::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.025) 0px,
      rgba(255, 255, 255, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .lcd-track-name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lcd-sub {
    margin-top: 2px;
    font-size: 12px;
    color: var(--lcd-fg-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lcd-time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 14px;
    color: var(--lcd-fg-dim);
  }

  .progress-track {
    margin-top: 6px;
    height: 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.08);
    cursor: pointer;
    position: relative;
  }

  .progress-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: var(--lcd-fg);
    border-radius: 4px;
  }

  .progress-track:hover .progress-fill { filter: brightness(1.15); }

  /* Transport */
  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 16px;
  }

  .transport-btn {
    border: none;
    background: var(--surface-2);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }

  .transport-btn:hover { background: var(--surface-3); }
  .transport-btn:active { transform: scale(0.92); }

  .transport-btn.play {
    width: 54px;
    height: 54px;
    background: var(--accent);
    color: var(--accent-ink);
  }

  .transport-btn.play:hover { filter: brightness(1.08); background: var(--accent); }

  .transport-btn:focus-visible,
  .icon-btn:focus-visible,
  .mode-btn:focus-visible,
  .track-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Mode toggle */
  .mode-toggle {
    position: relative;
    display: flex;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 3px;
    margin: 16px auto 0;
    width: fit-content;
  }

  .mode-highlight {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc(50% - 3px);
    background: var(--accent);
    border-radius: 999px;
    transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 0;
  }

  .mode-toggle[data-mode="shuffle"] .mode-highlight {
    transform: translateX(100%);
  }

  .mode-btn {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    padding: 7px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s ease;
  }

  .mode-toggle[data-mode="sequential"] .mode-btn.seq,
  .mode-toggle[data-mode="shuffle"] .mode-btn.shuf {
    color: var(--accent-ink);
  }

  /* Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 0 4px;
  }

  .volume-row svg { color: var(--text-faint); flex-shrink: 0; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: var(--surface-3);
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Playlist */
  .playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 20px 0 2px;
  }

  .playlist-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .source-note {
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--text-faint);
  }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .icon-btn:hover { background: var(--surface-2); }

  .playlist {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 232px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
  }

  .track-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    background: transparent;
    width: 100%;
    border-left: none;
    border-right: none;
    border-top: none;
    text-align: left;
    font-family: inherit;
    color: var(--text);
  }

  .track-row:hover { background: var(--surface-2); }

  .track-row.active {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .track-index {
    width: 20px;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
  }

  .eq {
    width: 20px;
    height: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
  }

  .eq span {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: eq-bounce 0.9s ease-in-out infinite;
  }

  .eq span:nth-child(1) { height: 40%; animation-delay: -0.6s; }
  .eq span:nth-child(2) { height: 100%; animation-delay: -0.3s; }
  .eq span:nth-child(3) { height: 65%; animation-delay: 0s; }

  @keyframes eq-bounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  .track-info { flex: 1; min-width: 0; }

  .track-name {
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-row.active .track-name { color: var(--accent); font-weight: 600; }

  .track-duration {
    font-size: 11.5px;
    color: var(--text-faint);
    flex-shrink: 0;
  }

  .track-remove {
    border: none;
    background: transparent;
    color: var(--text-faint);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .track-remove:hover { background: var(--surface-3); color: var(--danger); }

  .empty-state {
    padding: 28px 12px 8px;
    text-align: center;
  }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 14px;
    padding: 22px 14px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  .dropzone strong { color: var(--text); }

  .empty-state .icon-btn {
    margin-top: 12px;
    padding: 8px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }

  .hint {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--text-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    .eq span { animation: none; transform: scaleY(0.75); }
    .mode-highlight { transition: none; }
    .transport-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="deck" id="deck">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1.5" y="4.5" width="21" height="15" rx="2.2" stroke="var(--text)" stroke-width="1.4"/>
      <circle cx="8" cy="12" r="2.6" stroke="var(--text)" stroke-width="1.4"/>
      <circle cx="16" cy="12" r="2.6" stroke="var(--text)" stroke-width="1.4"/>
      <path d="M8 12h8" stroke="var(--text)" stroke-width="1.2"/>
    </svg>
    <span class="brand-text">믹스테이프</span>
    <span class="brand-count mono" id="trackCount"></span>
  </div>

  <div class="lcd">
    <div class="lcd-track-name" id="lcdTitle">불러오는 중...</div>
    <div class="lcd-sub" id="lcdSub"></div>
    <div class="lcd-time-row">
      <span class="mono" id="timeCurrent">0:00</span>
      <span class="mono" id="timeTotal">0:00</span>
    </div>
    <div class="progress-track" id="progressTrack" role="slider" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="mode-toggle" id="modeToggle" data-mode="sequential">
    <div class="mode-highlight"></div>
    <button class="mode-btn seq" id="modeSeq" type="button" aria-pressed="true">차례대로</button>
    <button class="mode-btn shuf" id="modeShuf" type="button" aria-pressed="false">랜덤</button>
  </div>

  <div class="transport">
    <button class="transport-btn" id="prevBtn" type="button" aria-label="이전 곡">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM19 6.5L9 12l10 5.5z"/></svg>
    </button>
    <button class="transport-btn play" id="playBtn" type="button" aria-label="재생">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M7 5.5v13l12-6.5z"/></svg>
    </button>
    <button class="transport-btn" id="nextBtn" type="button" aria-label="다음 곡">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6.5L15 12 5 17.5z"/></svg>
    </button>
  </div>

  <div class="volume-row">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
    <input type="range" id="volume" min="0" max="100" value="80" aria-label="음량">
  </div>

  <div class="playlist-header">
    <span class="playlist-title">재생목록</span>
    <button class="icon-btn" id="addBtn" type="button">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      곡 추가
    </button>
  </div>
  <div class="source-note" id="sourceNote"></div>

  <ul class="playlist" id="playlist" hidden></ul>

  <div class="empty-state" id="emptyState" hidden>
    <div class="dropzone">
      <div><strong>여기로 MP3 파일을 끌어다 놓으세요</strong></div>
      <div class="hint">또는 아래 버튼으로 직접 선택할 수 있어요 (이 기기에서만 재생됨)</div>
    </div>
    <button class="icon-btn" id="emptyAddBtn" type="button">파일 선택</button>
  </div>

  <input type="file" id="fileInput" accept="audio/*,.mp3" multiple hidden>
</div>

<script>
  (function () {
    "use strict";

    const audio = new Audio();
    const deck = document.getElementById("deck");
    const fileInput = document.getElementById("fileInput");
    const addBtn = document.getElementById("addBtn");
    const emptyAddBtn = document.getElementById("emptyAddBtn");
    const emptyState = document.getElementById("emptyState");
    const playlistEl = document.getElementById("playlist");
    const trackCountEl = document.getElementById("trackCount");
    const lcdTitle = document.getElementById("lcdTitle");
    const lcdSub = document.getElementById("lcdSub");
    const timeCurrent = document.getElementById("timeCurrent");
    const timeTotal = document.getElementById("timeTotal");
    const progressTrack = document.getElementById("progressTrack");
    const progressFill = document.getElementById("progressFill");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const modeToggle = document.getElementById("modeToggle");
    const modeSeq = document.getElementById("modeSeq");
    const modeShuf = document.getElementById("modeShuf");
    const volume = document.getElementById("volume");
    const sourceNote = document.getElementById("sourceNote");

    const ICON_PLAY = '<path d="M7 5.5v13l12-6.5z"/>';
    const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

    let tracks = [];       // {id, name, url, duration}
    let nextId = 1;
    let currentId = null;
    let mode = "sequential"; // or "shuffle"
    let shuffleQueue = [];
    let history = [];

    audio.volume = 0.8;

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ":" + String(s).padStart(2, "0");
    }

    function niceName(filename) {
      return filename.replace(/\.[^/.]+$/, "");
    }

    function findTrack(id) {
      return tracks.find((t) => t.id === id) || null;
    }

    function findIndex(id) {
      return tracks.findIndex((t) => t.id === id);
    }

    function isAudioFile(file) {
      return (file.type && file.type.startsWith("audio/")) || /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(file.name);
    }

    function addFiles(fileList) {
      const files = Array.from(fileList).filter(isAudioFile);
      if (!files.length) return;

      files.forEach((file) => {
        const url = URL.createObjectURL(file);
        const track = { id: nextId++, name: file.name, url, duration: null };
        tracks.push(track);

        const probe = new Audio();
        probe.preload = "metadata";
        probe.src = url;
        probe.addEventListener("loadedmetadata", () => {
          track.duration = probe.duration;
          renderPlaylist();
        }, { once: true });
      });

      if (currentId === null && tracks.length) {
        loadTrack(tracks[0].id, { autoplay: false });
      }

      renderPlaylist();
    }

    function renderPlaylist() {
      const has = tracks.length > 0;
      playlistEl.hidden = !has;
      emptyState.hidden = has;
      trackCountEl.textContent = has ? tracks.length + "곡" : "";

      playlistEl.innerHTML = "";
      tracks.forEach((track, i) => {
        const li = document.createElement("li");

        const row = document.createElement("button");
        row.type = "button";
        row.className = "track-row" + (track.id === currentId ? " active" : "");
        row.setAttribute("aria-current", track.id === currentId ? "true" : "false");

        const isPlayingThis = track.id === currentId && !audio.paused;

        row.innerHTML =
          (isPlayingThis
            ? '<span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>'
            : '<span class="track-index mono">' + (i + 1) + "</span>") +
          '<span class="track-info">' +
            '<div class="track-name" title="' + escapeHtml(track.name) + '">' + escapeHtml(niceName(track.name)) + "</div>" +
          "</span>" +
          '<span class="track-duration mono">' + (track.duration != null ? formatTime(track.duration) : "--:--") + "</span>";

        row.addEventListener("click", () => loadTrack(track.id, { autoplay: true }));

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "track-remove";
        removeBtn.setAttribute("aria-label", track.name + " 목록에서 빼기");
        removeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        removeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeTrack(track.id);
        });

        li.style.display = "flex";
        li.appendChild(row);
        li.appendChild(removeBtn);
        li.style.alignItems = "center";
        li.style.borderBottom = "1px solid var(--border)";
        row.style.borderBottom = "none";
        playlistEl.appendChild(li);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function removeTrack(id) {
      const track = findTrack(id);
      if (!track) return;
      const wasCurrent = id === currentId;

      tracks = tracks.filter((t) => t.id !== id);
      history = history.filter((h) => h !== id);
      shuffleQueue = shuffleQueue.filter((q) => q !== id);
      if (track.url.startsWith("blob:")) URL.revokeObjectURL(track.url);

      if (wasCurrent) {
        audio.pause();
        audio.removeAttribute("src");
        currentId = null;
        if (tracks.length) {
          loadTrack(tracks[0].id, { autoplay: false });
        } else {
          updateLcdEmpty();
        }
      }
      renderPlaylist();
    }

    function updateLcdEmpty() {
      lcdTitle.textContent = "재생목록이 비어 있어요";
      lcdSub.textContent = "MP3를 올리면 여기서 재생돼요";
      timeCurrent.textContent = "0:00";
      timeTotal.textContent = "0:00";
      progressFill.style.width = "0%";
      setPlayingUI(false);
    }

    function loadTrack(id, opts) {
      const track = findTrack(id);
      if (!track) return;

      if (currentId !== null && currentId !== id) {
        history.push(currentId);
        if (history.length > 50) history.shift();
      }

      currentId = id;
      audio.src = track.url;
      lcdTitle.textContent = niceName(track.name);
      lcdSub.textContent = mode === "shuffle" ? "랜덤 재생 중" : "차례대로 재생 중";
      timeCurrent.textContent = "0:00";
      timeTotal.textContent = track.duration != null ? formatTime(track.duration) : "0:00";
      progressFill.style.width = "0%";

      if (opts && opts.autoplay) {
        audio.play().catch(() => {});
      }
      renderPlaylist();
    }

    function setPlayingUI(playing) {
      playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      playBtn.setAttribute("aria-label", playing ? "일시정지" : "재생");
    }

    function togglePlay() {
      if (!tracks.length) return;
      if (currentId === null) {
        loadTrack(tracks[0].id, { autoplay: true });
        return;
      }
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    function buildShuffleQueue() {
      const idxs = tracks.map((t) => t.id).filter((id) => id !== currentId);
      for (let i = idxs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
      }
      return idxs;
    }

    function goNext(fromEnded) {
      if (!tracks.length) return;

      if (tracks.length === 1) {
        loadTrack(tracks[0].id, { autoplay: true });
        return;
      }

      if (mode === "shuffle") {
        if (!shuffleQueue.length) shuffleQueue = buildShuffleQueue();
        const id = shuffleQueue.shift();
        loadTrack(id, { autoplay: true });
      } else {
        const i = findIndex(currentId);
        const nextIdx = i === -1 ? 0 : (i + 1) % tracks.length;
        loadTrack(tracks[nextIdx].id, { autoplay: true });
      }
    }

    function goPrev() {
      if (!tracks.length) return;

      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }

      if (history.length) {
        const id = history.pop();
        if (findTrack(id)) {
          currentId = id; // avoid re-pushing via loadTrack's own history logic
          const track = findTrack(id);
          audio.src = track.url;
          lcdTitle.textContent = niceName(track.name);
          lcdSub.textContent = mode === "shuffle" ? "랜덤 재생 중" : "차례대로 재생 중";
          timeTotal.textContent = track.duration != null ? formatTime(track.duration) : "0:00";
          audio.play().catch(() => {});
          renderPlaylist();
          return;
        }
      }

      const i = findIndex(currentId);
      const prevIdx = i === -1 ? 0 : (i - 1 + tracks.length) % tracks.length;
      loadTrack(tracks[prevIdx].id, { autoplay: true });
    }

    function setMode(next) {
      mode = next;
      modeToggle.dataset.mode = mode;
      modeSeq.setAttribute("aria-pressed", String(mode === "sequential"));
      modeShuf.setAttribute("aria-pressed", String(mode === "shuffle"));
      shuffleQueue = [];
      if (currentId !== null) {
        lcdSub.textContent = mode === "shuffle" ? "랜덤 재생 중" : "차례대로 재생 중";
      }
    }

    function seekFromEvent(e) {
      if (!audio.duration) return;
      const rect = progressTrack.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const ratio = Math.min(1, Math.max(0, x / rect.width));
      audio.currentTime = ratio * audio.duration;
    }

    // --- events ---

    addBtn.addEventListener("click", () => fileInput.click());
    emptyAddBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      addFiles(e.target.files);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach((evt) =>
      deck.addEventListener(evt, (e) => {
        e.preventDefault();
        deck.classList.add("drag-over");
      })
    );
    ["dragleave", "drop"].forEach((evt) =>
      deck.addEventListener(evt, (e) => {
        e.preventDefault();
        if (evt === "dragleave" && e.target !== deck) return;
        deck.classList.remove("drag-over");
      })
    );
    deck.addEventListener("drop", (e) => {
      if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });

    playBtn.addEventListener("click", togglePlay);
    nextBtn.addEventListener("click", () => goNext(false));
    prevBtn.addEventListener("click", goPrev);

    modeSeq.addEventListener("click", () => setMode("sequential"));
    modeShuf.addEventListener("click", () => setMode("shuffle"));

    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value) / 100;
    });

    progressTrack.addEventListener("click", seekFromEvent);
    progressTrack.addEventListener("keydown", (e) => {
      if (!audio.duration) return;
      if (e.key === "ArrowRight") audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      if (e.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
    });

    audio.addEventListener("timeupdate", () => {
      timeCurrent.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + "%";
        progressTrack.setAttribute("aria-valuenow", String(Math.round(pct)));
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      timeTotal.textContent = formatTime(audio.duration);
      const track = findTrack(currentId);
      if (track) track.duration = audio.duration;
    });

    audio.addEventListener("play", () => { setPlayingUI(true); renderPlaylist(); });
    audio.addEventListener("pause", () => { setPlayingUI(false); renderPlaylist(); });
    audio.addEventListener("ended", () => goNext(true));

    // --- load the playlist straight from this repo's /songs folder on GitHub ---
    // Works when the page is served from GitHub Pages (https://<user>.github.io/<repo>/).
    // Add or remove mp3 files in the "songs" folder on GitHub and they show up here
    // automatically the next time this page loads — no code changes needed.
    async function loadFromGithub() {
      const host = location.hostname;
      if (!host.endsWith("github.io")) {
        updateLcdEmpty();
        return;
      }
      const owner = host.split(".")[0];
      const pathParts = location.pathname.split("/").filter(Boolean);
      const repo = pathParts.length ? pathParts[0] : (owner + ".github.io");

      try {
        const res = await fetch(
          "https://api.github.com/repos/" + owner + "/" + repo + "/contents/songs",
          { headers: { Accept: "application/vnd.github+json" } }
        );
        if (!res.ok) throw new Error("GitHub API " + res.status);
        const items = await res.json();
        if (!Array.isArray(items)) throw new Error("unexpected response");

        const files = items
          .filter((it) => it.type === "file" && /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(it.name))
          .sort((a, b) => a.name.localeCompare(b.name, "ko"));

        if (!files.length) {
          sourceNote.textContent = "songs 폴더에 곡을 올리면 여기 자동으로 나타나요";
          updateLcdEmpty();
          return;
        }

        files.forEach((file) => {
          const title = niceName(file.name).replace(/^\d+[_\-.\s]*/, "").replace(/_/g, " ").trim() || niceName(file.name);
          const track = { id: nextId++, name: title, url: file.download_url, duration: null };
          tracks.push(track);

          const probe = new Audio();
          probe.preload = "metadata";
          probe.src = file.download_url;
          probe.addEventListener("loadedmetadata", () => {
            track.duration = probe.duration;
            renderPlaylist();
          }, { once: true });
        });

        sourceNote.textContent = "GitHub의 songs 폴더와 연결되어 있어요 · 새 파일을 올리면 자동 반영";
        loadTrack(tracks[0].id, { autoplay: false });
        renderPlaylist();
      } catch (err) {
        lcdTitle.textContent = "재생목록을 불러오지 못했어요";
        lcdSub.textContent = "새로고침해 보거나 잠시 후 다시 시도해 주세요";
        sourceNote.textContent = "";
      }
    }

    loadFromGithub();
  })();
</script>
</body>
</html>
